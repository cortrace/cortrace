name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  format:
    name: clang-format (WebKit)
    # Pinned: clang-format changes its output between major versions, and the
    # sources are formatted with the 22.04 one (14), the same as the local hook.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: bash scripts/format.sh --check

  build-test-coverage:
    name: build + test (ASan + UBSan) + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr libopencsd-dev

      # ASan+UBSan and gcov can't share a build dir (gcovr can't parse
      # ASan-instrumented gcov), so use two build dirs in this one job.
      - name: Configure (ASan + UBSan, -Werror)
        run: cmake -S . -B build-asan -DCORTRACE_ASAN=ON -DCORTRACE_WERROR=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build (sanitized)
        run: cmake --build build-asan -j"$(nproc)"

      - name: Run tests under sanitizers
        # halt_on_error=1 so any ASan/UBSan finding fails the job; detect_leaks
        # catches leaks at exit. --timeout caps the rare ASan-init CPU spin.
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 120

      - name: Configure (coverage, -Werror)
        run: cmake -S . -B build -DENABLE_COVERAGE=ON -DCORTRACE_WERROR=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build (coverage)
        run: cmake --build build -j"$(nproc)"

      - name: Coverage gate (also runs the tests; fails under the line threshold)
        run: cmake --build build --target coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage-html
          if-no-files-found: ignore

  python:
    name: python (black + pylint + pytest coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tools
        run: pip install black pylint pytest pytest-cov pyelftools tomli
      - name: Format + lint (black --check + pylint)
        run: bash scripts/format-py.sh --check
      - name: Tests + coverage gate (fail under 90%)
        run: pytest python/tests --cov --cov-report=term-missing --cov-fail-under=90

  deb:
    name: .deb (ubuntu 22.04) build + smoke test
    # 22.04 runner: the package must link against 22.04's glibc/libstdc++.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # tags are needed to tell a release from a dev build

      - name: A release tag must match the VERSION file (v<VERSION>)
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Build the package (in an ubuntu:22.04 container)
        run: bash scripts/build-deb.sh dist

      - name: Smoke test (clean container, non-root user)
        run: bash scripts/smoke-deb.sh dist/cortrace_*.deb

      - name: Decode contract (Python tools vs the packaged cortrace-decode)
        run: |
          pip install pytest
          dpkg-deb -x dist/cortrace_*.deb /tmp/pkg
          CORTRACE_DECODE=/tmp/pkg/usr/bin/cortrace-decode \
            python3 -m pytest python/tests/test_decode_contract.py -v

      - uses: actions/upload-artifact@v4
        with:
          name: cortrace-deb
          path: dist/cortrace_*.deb

  release:
    name: attach the .deb to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, build-test-coverage, python, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cortrace-deb
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/cortrace_*.deb
          generate_release_notes: true
          # v1.0.0a1 / b1 / rc1 / .dev1 are marked as pre-releases
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
